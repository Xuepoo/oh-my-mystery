# Lefthook — unified git hooks
# https://lefthook.dev
pre-commit:
  parallel: false
  jobs:
    - name: oxfmt
      glob: '*.{js,ts,jsx,tsx,mjs,cjs,json}'
      run: bun x oxfmt --write {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: '*.{js,ts,jsx,tsx,mjs,cjs}'
      run: bun x oxlint --fix {staged_files}
      stage_fixed: true
    - name: markdownlint
      glob: '*.md'
      run: bun x markdownlint-cli2 --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bun x --no -- commitlint --edit {1}
