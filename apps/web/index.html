<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oh My Mystery (OMM) — 全球推理小说知识图谱与推荐系统</title>
    <meta
      name="description"
      content="基于 VectoJS Native 零 DOM 渲染的全球推理小说知识图谱可视化与侦探档案探索系统，汇聚千部中日欧美本格、变格、新本格推理名作与宗师脉络。"
    />
    <meta name="theme-color" content="#161311" />
    <link rel="icon" type="image/png" href="/omm-logo.png" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oh My Mystery (OMM) — 推理知识图谱" />
    <meta property="og:description" content="全球推理小说知识图谱可视化与侦探档案探索系统" />
    <meta property="og:url" content="https://omm.xuepoo.xyz" />

    <!-- Preconnect & Non-blocking Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap"
      />
    </noscript>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #161311;
        font-family: 'Noto Serif SC', 'Cinzel', serif, sans-serif;
        color: #e8e2d9;
      }
      #app-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #app-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
        pointer-events: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <div
        id="omm-boot-header"
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 64px;
          background: #201914;
          border-bottom: 1px solid #6b5746;
          display: flex;
          align-items: center;
          padding: 0 24px;
          z-index: 0;
        "
      >
        <span
          style="
            font-size: 18px;
            font-weight: 700;
            color: #f3c476;
            letter-spacing: 1px;
            font-family: serif;
          "
          >OH MY MYSTERY</span
        >
        <span style="font-size: 11px; color: #c9bca8; margin-left: 14px; font-family: sans-serif"
          >推理知识图谱</span
        >
      </div>
      <canvas id="app-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
