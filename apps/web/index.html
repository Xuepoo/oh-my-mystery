<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Oh My Mystery (OMM) — 全球推理小说知识图谱与推荐系统</title>
    <meta
      name="description"
      content="基于 VectoJS Native 零 DOM 渲染的全球推理小说知识图谱可视化与侦探档案探索系统。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #161311;
        font-family: 'Noto Serif SC', 'Cinzel', serif, sans-serif;
        color: #e8e2d9;
      }
      #app-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #graph-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }
      #ui-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 2;
        pointer-events: auto;
      }
      #cf-turnstile-container {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <canvas id="graph-canvas"></canvas>
      <canvas id="ui-canvas"></canvas>
      <div id="cf-turnstile-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
